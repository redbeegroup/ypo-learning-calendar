# Portainer stack for the YPO SEA Learning Calendar, fronted by NPMplus (Nginx Proxy Manager).
#
# - The image is built by GitHub Actions (.github/workflows/build-image.yml) and published to GHCR.
#   Portainer only pulls it, so no build happens on the server. Set APP_IMAGE to your image, e.g.
#   ghcr.io/<github-user>/ypo-lc:latest. Deploy as a Portainer "Repository" stack (or paste this file).
# - Set the variables listed in .env.portainer.example in the stack's "Environment variables" section.
# - The app is published on APP_PORT (default 3030) of this Docker host. The ":3000" after it is the port inside the container and must stay. NPMplus, running on another host,
#   forwards to http://<this host's IP>:<APP_PORT>. Firewall that port so only the NPMplus host can reach it.
# - Everything is a named volume, so the stack works without any files on the host.
name: ypo-lc

services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE, e.g. ghcr.io/<github-user>/ypo-lc:latest}
    container_name: ypo-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?set APP_URL, e.g. https://learning.example.org}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random string}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ypo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ypo}?schema=public
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM, e.g. "YPO SEA Learning <admin@example.org>"}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Admin}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3030}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: ypo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ypo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ypo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ypo} -d ${POSTGRES_DB:-ypo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    container_name: ypo-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-ypo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-ypo}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    # Daily pg_dump into the "backups" volume, keeping BACKUP_KEEP_DAYS days.
    # Copy dumps off the server with: docker cp ypo-backup:/backups ./backups
    command:
      - sh
      - -c
      - |
        mkdir -p /backups
        while true; do
          f="/backups/$${PGDATABASE}-$$(date -u +%Y%m%d-%H%M%S).sql.gz"
          if pg_dump --no-owner --no-privileges | gzip > "$$f"; then echo "backup written: $$f"; else echo "backup FAILED" >&2; rm -f "$$f"; fi
          find /backups -name '*.sql.gz' -mtime +"$${BACKUP_KEEP_DAYS:-14}" -delete
          sleep 86400
        done
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backups:
